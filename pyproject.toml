[project]
name = "pcl2"
version = "0.1.0"
description = "Python + PySide6 实现的 Minecraft 启动器（参考 PCL2 的信息架构与交互）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "httpx>=0.27,<1",
]

[project.scripts]
pcl2 = "pcl.app:run"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcl"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.uv]
default-groups = ["dev"]
# PySide6 缺少 Python 3.14 的 wheel，锁定在受支持的版本上
python-downloads = "automatic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "gui: 需要 Qt offscreen 平台的界面冒烟测试",
    "network: 需要访问外部下载源的测试",
]
timeout = 120

[tool.pyinstaller]
noconsole = false
onefile = false
name = "pcl2"
add_data = "src/pcl/resources:src/pcl/resources"
